<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="iphoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7355"/>
      <stop offset="50%" style="stop-color:#A69076"/>
      <stop offset="100%" style="stop-color:#6B5B45"/>
    </linearGradient>
    <linearGradient id="screen1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Phone Body -->
  <rect x="55" y="15" width="90" height="170" rx="12" fill="url(#iphoneBody)" filter="url(#shadow1)"/>
  <!-- Titanium Frame -->
  <rect x="57" y="17" width="86" height="166" rx="10" fill="none" stroke="#C4B5A0" stroke-width="1"/>
  <!-- Screen -->
  <rect x="61" y="25" width="78" height="150" rx="6" fill="url(#screen1)"/>
  <!-- Dynamic Island -->
  <rect x="85" y="30" width="30" height="8" rx="4" fill="#000"/>
  <!-- Camera Island -->
  <rect x="68" y="22" width="30" height="30" rx="8" fill="#5A4A3A"/>
  <circle cx="78" cy="32" r="6" fill="#2A2A3E" stroke="#8B7355" stroke-width="1.5"/>
  <circle cx="90" cy="32" r="6" fill="#2A2A3E" stroke="#8B7355" stroke-width="1.5"/>
  <circle cx="78" cy="44" r="6" fill="#2A2A3E" stroke="#8B7355" stroke-width="1.5"/>
  <circle cx="78" cy="32" r="2.5" fill="#1a1a3e"/>
  <circle cx="90" cy="32" r="2.5" fill="#1a1a3e"/>
  <circle cx="78" cy="44" r="2.5" fill="#1a1a3e"/>
  <!-- Screen Content -->
  <text x="100" y="80" text-anchor="middle" font-family="Arial" font-size="8" fill="#6C3CE1">15:30</text>
  <text x="100" y="100" text-anchor="middle" font-family="Arial" font-size="6" fill="#999">iPhone 15 Pro</text>
  <!-- Home Indicator -->
  <rect x="88" y="168" width="24" height="3" rx="1.5" fill="#666"/>
</svg>