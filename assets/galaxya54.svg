<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="a54Body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2d3d"/>
      <stop offset="100%" style="stop-color:#1a1a28"/>
    </linearGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Phone Body -->
  <rect x="58" y="12" width="84" height="176" rx="12" fill="url(#a54Body)" filter="url(#shadow4)"/>
  <!-- Screen -->
  <rect x="62" y="18" width="76" height="164" rx="6" fill="#0a0a1a"/>
  <!-- Camera Punch Hole -->
  <circle cx="100" cy="28" r="4" fill="#000"/>
  <circle cx="100" cy="28" r="2" fill="#1a1a2e"/>
  <!-- Triple Camera -->
  <rect x="70" y="18" width="20" height="60" rx="6" fill="#252535"/>
  <circle cx="80" cy="30" r="6" fill="#1a1a28" stroke="#444" stroke-width="1"/>
  <circle cx="80" cy="46" r="6" fill="#1a1a28" stroke="#444" stroke-width="1"/>
  <circle cx="80" cy="62" r="5" fill="#1a1a28" stroke="#444" stroke-width="1"/>
  <circle cx="80" cy="30" r="2.5" fill="#0a0a1a"/>
  <circle cx="80" cy="46" r="2.5" fill="#0a0a1a"/>
  <circle cx="80" cy="62" r="2" fill="#0a0a1a"/>
  <!-- Screen Content -->
  <text x="100" y="100" text-anchor="middle" font-family="Arial" font-size="8" fill="#06B6D4">15:30</text>
  <text x="100" y="118" text-anchor="middle" font-family="Arial" font-size="6" fill="#666">Galaxy A54</text>
  <!-- Home Indicator -->
  <rect x="90" y="178" width="20" height="2.5" rx="1.25" fill="#444"/>
</svg>