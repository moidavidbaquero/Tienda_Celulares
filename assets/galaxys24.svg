<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="samsungBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#2d2d44"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <linearGradient id="screen2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0a1628"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Phone Body -->
  <rect x="58" y="12" width="84" height="176" rx="10" fill="url(#samsungBody)" filter="url(#shadow2)"/>
  <!-- Screen -->
  <rect x="62" y="18" width="76" height="164" rx="4" fill="url(#screen2)"/>
  <!-- Camera Punch Hole -->
  <circle cx="100" cy="28" r="4" fill="#000"/>
  <circle cx="100" cy="28" r="2" fill="#1a1a3e"/>
  <!-- Camera Module Back -->
  <rect x="68" y="18" width="24" height="55" rx="6" fill="#252540"/>
  <circle cx="80" cy="30" r="7" fill="#1a1a3e" stroke="#3a3a5e" stroke-width="1"/>
  <circle cx="80" cy="48" r="7" fill="#1a1a3e" stroke="#3a3a5e" stroke-width="1"/>
  <circle cx="80" cy="66" r="7" fill="#1a1a3e" stroke="#3a3a5e" stroke-width="1"/>
  <circle cx="80" cy="30" r="3" fill="#0a0a1e"/>
  <circle cx="80" cy="48" r="3" fill="#0a0a1e"/>
  <circle cx="80" cy="66" r="3" fill="#0a0a1e"/>
  <!-- Screen Content -->
  <text x="100" y="90" text-anchor="middle" font-family="Arial" font-size="8" fill="#22D3EE">15:30</text>
  <text x="100" y="110" text-anchor="middle" font-family="Arial" font-size="6" fill="#666">Galaxy S24</text>
  <!-- Home Indicator -->
  <rect x="90" y="178" width="20" height="2.5" rx="1.25" fill="#555"/>
</svg>