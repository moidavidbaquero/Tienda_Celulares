<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="xiaomiBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5"/>
      <stop offset="50%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#d4d4d4"/>
    </linearGradient>
    <linearGradient id="screen3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Phone Body -->
  <rect x="58" y="12" width="84" height="176" rx="10" fill="url(#xiaomiBody)" filter="url(#shadow3)"/>
  <!-- Screen -->
  <rect x="62" y="18" width="76" height="164" rx="4" fill="url(#screen3)"/>
  <!-- Leica Camera Module -->
  <circle cx="100" cy="50" r="28" fill="#2a2a3e"/>
  <circle cx="100" cy="50" r="24" fill="#1a1a2e"/>
  <!-- Leica Lens -->
  <circle cx="100" cy="50" r="18" fill="#0a0a1a" stroke="#ff6600" stroke-width="2"/>
  <circle cx="100" cy="50" r="12" fill="#1a1a3e"/>
  <circle cx="100" cy="50" r="6" fill="#333"/>
  <circle cx="100" cy="50" r="2" fill="#6C3CE1"/>
  <!-- Leica Text -->
  <text x="100" y="82" text-anchor="middle" font-family="Arial" font-size="5" fill="#ff6600" font-weight="bold">LEICA</text>
  <!-- Screen Content -->
  <text x="100" y="110" text-anchor="middle" font-family="Arial" font-size="8" fill="#F97316">15:30</text>
  <text x="100" y="130" text-anchor="middle" font-family="Arial" font-size="6" fill="#666">Xiaomi 14 Ultra</text>
  <!-- Home Indicator -->
  <rect x="90" y="178" width="20" height="2.5" rx="1.25" fill="#555"/>
</svg>