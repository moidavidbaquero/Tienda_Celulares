<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="iphone15Body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2d3d"/>
      <stop offset="100%" style="stop-color:#1a1a28"/>
    </linearGradient>
    <linearGradient id="screen15" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <filter id="shadow6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Phone Body -->
  <rect x="55" y="15" width="90" height="170" rx="12" fill="url(#iphone15Body)" filter="url(#shadow6)"/>
  <!-- Screen -->
  <rect x="61" y="25" width="78" height="150" rx="6" fill="url(#screen15)"/>
  <!-- Dynamic Island -->
  <rect x="85" y="30" width="30" height="8" rx="4" fill="#000"/>
  <!-- Dual Camera -->
  <rect x="68" y="22" width="28" height="28" rx="8" fill="#252540"/>
  <circle cx="78" cy="32" r="6" fill="#1a1a3e" stroke="#444" stroke-width="1"/>
  <circle cx="92" cy="32" r="6" fill="#1a1a3e" stroke="#444" stroke-width="1"/>
  <circle cx="78" cy="32" r="2.5" fill="#0a0a1e"/>
  <circle cx="92" cy="32" r="2.5" fill="#0a0a1e"/>
  <!-- Screen Content -->
  <text x="100" y="80" text-anchor="middle" font-family="Arial" font-size="8" fill="#3B82F6">15:30</text>
  <text x="100" y="100" text-anchor="middle" font-family="Arial" font-size="6" fill="#888">iPhone 15</text>
  <!-- Home Indicator -->
  <rect x="88" y="168" width="24" height="3" rx="1.5" fill="#555"/>
</svg>